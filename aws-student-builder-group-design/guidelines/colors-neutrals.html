<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-display);background:var(--slate-900)}

.label{padding:8px 12px;font-size:11px;color:var(--slate-200);text-transform:uppercase;letter-spacing:.06em}
</style>
<div class="row">
<div class="sw" style="background:var(--navy-900)">navy-900</div>
<div class="sw" style="background:var(--navy-700)">navy-700</div>
<div class="sw" style="background:var(--slate-900)">slate-900</div>
<div class="sw" style="background:var(--slate-700)">slate-700</div>
<div class="sw" style="background:var(--slate-600)">slate-600</div>
<div class="sw" style="background:var(--slate-400)">slate-400</div>
<div class="sw" style="background:var(--slate-200);color:#111">slate-200</div>
<div class="sw" style="background:var(--white);color:#111">white</div>
</div>
