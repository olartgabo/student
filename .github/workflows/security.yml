name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # What ships is a static export, so runtime dependencies are held to
      # "high". Dev tooling is held to "critical": `braces` (pulled in by
      # eslint-config-next via fast-glob) has a high advisory with no patched
      # release, and it never reaches the published site.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=critical
